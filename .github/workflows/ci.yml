name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    name: Windows (Qt 6.8 MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_mingw
          cache: 'true'
          tools: 'tools_mingw1310'

      # runner 自带的 MinGW (C:\mingw64, GCC 15) 与 Qt 6.8.1 MinGW 构建（GCC 13.1）ABI 不兼容，
      # 必须把随 Qt 安装的 MinGW 13.1 顶到 PATH 最前
      - name: Prefer Qt-bundled MinGW
        shell: pwsh
        run: |
          $qtBin = Split-Path (Get-Command qmake).Source
          $mingwBin = Resolve-Path (Join-Path $qtBin "..\..\..\Tools\mingw1310_64\bin")
          Add-Content $env:GITHUB_PATH $mingwBin

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      # -V：tst_app 出过一次「失败但零输出」的崩溃，只有全量日志才留得下线索
      # --repeat until-pass:2：tst_app 含多线程排课，CI 上偶发；重试一次以区分偶发与真实缺陷
      - name: Test
        run: ctest --test-dir build -V --repeat until-pass:2

      - name: Deploy (windeployqt)
        if: github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          mkdir deploy
          copy build\SmartScheduler.exe deploy\
          windeployqt --release --compiler-runtime --qmldir src\ui deploy\SmartScheduler.exe

      # 只上传单个 zip：deploy/ 有 1300+ 文件，目录直传会迅速耗尽 Actions 存储配额
      - name: Package portable
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path deploy\* -DestinationPath "SmartScheduler-win64-$($env:GITHUB_SHA.Substring(0,7)).zip" -CompressionLevel Optimal

      # 配额耗尽（每 6-12 小时才重算）不该让 CI 变红：正式产物由 tag 触发的 release.yml 产出
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SmartScheduler-windows
          path: SmartScheduler-win64-*.zip
          retention-days: 3
