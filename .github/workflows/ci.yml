name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    name: Windows (Qt 6.8 MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_mingw
          cache: 'true'

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy (windeployqt)
        if: github.ref == 'refs/heads/main'
        run: |
          windeployqt --qmldir src/ui --release --compiler-runtime build/src/SmartScheduler.exe
        shell: cmd

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SmartScheduler-windows
          path: build/src/
