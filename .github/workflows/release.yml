name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-release:
    name: Windows 发布构建
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_mingw
          cache: 'true'
          tools: 'tools_mingw1310'

      # runner 自带的 MinGW (GCC 15) 与 Qt 6.8.1 MinGW 构建（GCC 13.1）ABI 不兼容，
      # 必须把随 Qt 安装的 MinGW 13.1 顶到 PATH 最前
      - name: Prefer Qt-bundled MinGW
        shell: pwsh
        run: |
          $qtBin = Split-Path (Get-Command qmake).Source
          $mingwBin = Resolve-Path (Join-Path $qtBin "..\..\..\Tools\mingw1310_64\bin")
          Add-Content $env:GITHUB_PATH $mingwBin

      - name: Configure & Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy (windeployqt)
        shell: cmd
        run: |
          mkdir deploy
          copy build\SmartScheduler.exe deploy\
          windeployqt --release --compiler-runtime --qmldir src\ui deploy\SmartScheduler.exe

      - name: Zip portable
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart('v')
          Compress-Archive -Path deploy\* -DestinationPath "SmartScheduler-$ver-win64-portable.zip" -CompressionLevel Optimal

      - name: Installer (Inno Setup)
        shell: cmd
        run: |
          set VER=%GITHUB_REF_NAME:v=%
          where iscc >nul 2>nul || choco install innosetup -y --no-progress
          where iscc >nul 2>nul && iscc /DMyAppVersion=%VER% installer\SmartScheduler.iss || "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VER% installer\SmartScheduler.iss

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}"
          $zip = "SmartScheduler-$($ver.TrimStart('v'))-win64-portable.zip"
          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          $files = @($zip)
          if ($setup) { $files += $setup.FullName }
          gh release create $ver $files --title "智排课系统 $ver" --generate-notes

      # 双发到公开 Releases 仓库：应用内「检查更新」匿名查询该仓库的 latest release
      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}"
          $zip = "SmartScheduler-$($ver.TrimStart('v'))-win64-portable.zip"
          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          $files = @($zip)
          if ($setup) { $files += $setup.FullName }
          gh release create $ver $files --repo tangkris1101-alt/SmartScheduler-Releases --title "智排课系统 $ver" --generate-notes
